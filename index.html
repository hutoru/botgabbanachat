<!doctype html>
<html lang="ru" data-theme="light"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Каталог</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#fafaf8;--ink:#141414;--mut:#84817a;--line:#e7e4dd;--ph:#eeece6;--btn:#141414;--btn-ink:#fafaf8;--sans:Onest,system-ui,-apple-system,"Segoe UI",sans-serif}
[data-theme=dark]{--bg:#0e0e0e;--ink:#f1efea;--mut:#8f8c85;--line:#262522;--ph:#1a1917;--btn:#f1efea;--btn-ink:#0e0e0e}
*{box-sizing:border-box;margin:0}
html{-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--sans);padding:env(safe-area-inset-top) 18px 110px}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
button{border:0;background:none;color:inherit;font:inherit;cursor:pointer}
header{display:flex;justify-content:space-between;align-items:flex-end;padding:28px 0 20px}
h1{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
#count{color:var(--mut);font-size:14px;margin-top:6px}
#svc{color:var(--mut);padding:6px 0;font-size:14px;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--line)}
.search{width:100%;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-size:16px;border-radius:0;outline:0;transition:border-color .2s}
.search:focus{border-color:var(--ink)}
.search::placeholder{color:var(--mut)}
.tabs{display:flex;gap:20px;overflow-x:auto;scrollbar-width:none;padding:6px 0 4px;margin-bottom:22px}
.tabs button{flex:none;padding:10px 0;color:var(--mut);transition:color .2s}
.tabs button.on{color:var(--ink);font-weight:500}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:28px 14px}
.ph{position:relative;aspect-ratio:3/4;background:var(--ph);border-radius:6px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .4s}
.ph img.ok{opacity:1}
.flag{position:absolute;top:8px;left:8px;background:var(--bg);color:var(--ink);font-size:12px;font-weight:500;padding:3px 9px;border-radius:99px}
.meta{padding-top:10px}
.meta h3{font-weight:500;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta p{color:var(--mut);font-size:13px;margin-top:2px}
.meta .pr{color:var(--ink);font-weight:600;font-size:15px;margin-top:6px}
.buy{margin-top:10px;width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;font-weight:500;transition:background .15s,color .15s,border-color .15s}
.buy:active{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.sk .ph{animation:pulse 1.4s ease-in-out infinite}
.sk i{display:block;height:10px;margin-top:12px;width:70%;background:var(--ph);border-radius:4px}
.state{grid-column:1/-1;text-align:center;padding:64px 12px;color:var(--mut)}
.state b{display:block;font-size:17px;font-weight:600;color:var(--ink);margin-bottom:6px}
.state .buy{width:auto;margin-top:18px;padding:10px 22px}
.bar{position:fixed;inset:auto 0 0;padding:28px 18px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 40%)}
#post,#go{width:100%;padding:15px;border-radius:8px;background:var(--btn);color:var(--btn-ink);font-weight:500}
.sheet{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;visibility:hidden;opacity:0;transition:opacity .25s,visibility .25s}
.sheet.on{visibility:visible;opacity:1}
.sheet>div{width:100%;background:var(--bg);border-radius:16px 16px 0 0;padding:24px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(24px);transition:transform .3s}
.sheet.on>div{transform:none}
.sheet h2{font-size:20px;font-weight:600;letter-spacing:-.01em}
.sheet .lead{color:var(--mut);margin:6px 0 8px}
.svc{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.svc small{display:block;color:var(--mut);font-size:13px}
.svc b{font-weight:600;white-space:nowrap}
#go{margin-top:18px}
[hidden]{display:none!important}
.seg{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-bottom:16px}
.seg button{padding:10px 0;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px}
.seg .on{color:var(--ink);border-color:var(--ink);font-weight:500}
.nums{display:flex;gap:30px;padding:6px 0 10px}
.nums b{display:block;font-size:26px;font-weight:600;letter-spacing:-.02em}
.nums span{color:var(--mut);font-size:13px}
#me h4{font-size:13px;color:var(--mut);font-weight:500;margin:24px 0 2px}
.row{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.row small{display:block;color:var(--mut);font-size:13px}
.row .buy{width:auto;margin:0;padding:8px 14px;align-self:center;flex:none}
@keyframes pulse{50%{opacity:.5}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<header><div><h1 id="h">Каталог</h1><p id="count">Загружаем</p></div><button id="svc">Продвижение</button></header>
<nav class="seg"><button class="on" data-v="cat">Каталог</button><button data-v="me">Кабинет</button></nav>
<section id="cat">
<input class="search" id="q" type="search" placeholder="Поиск" aria-label="Поиск">
<nav class="tabs" id="tabs" aria-label="Теги"></nav>
<main class="grid" id="grid"></main>
</section>
<section id="me" hidden></section>
<div class="bar"><button id="post">Выставить вещь</button></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh"><div>
<h2 id="sh">Продвижение объявлений</h2>
<p class="lead">Платное объявление выходит первым и отмечено в каталоге.</p>
<div id="list"></div><button id="go">Выставить вещь</button></div></div>
<script>
const tg=window.Telegram&&Telegram.WebApp||{};
const dark=(tg.colorScheme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"))==="dark";
document.documentElement.dataset.theme=dark?"dark":"light";
try{tg.ready();tg.expand();const c=dark?"#0e0e0e":"#fafaf8";tg.setHeaderColor(c);tg.setBackgroundColor(c)}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const go=u=>tg.openTelegramLink?tg.openTelegramLink(u):window.open(u,"_blank");
const DEMO={bot:"demo_bot",services:[{name:"Приоритет",price:10,desc:"Первое место в каталоге и отметка"},{name:"VIP",price:40,desc:"Приоритет и закреп в чате на 24 часа"}],
items:[{id:1,title:"Шёлковая рубашка",size:"M",price:"18 500 ₽",tags:["рубашка"],vip:true,link:"#"},
{id:2,title:"Сумка через плечо",size:"one size",price:"64 000 ₽",tags:["сумка"],vip:false,link:"#"},
{id:3,title:"Лоферы, кожа",size:"42",price:"12 900 ₽",tags:["обувь"],vip:false,link:"#"},
{id:4,title:"Ремень",size:"90",price:"7 200 ₽",tags:["аксессуары"],vip:false,link:"#"}]};
let D={items:[],services:[],bot:""},tag="";
const sk=()=>'<article class="sk"><div class="ph"></div><i></i><i style="width:40%"></i></article>'.repeat(4);
function tabs(){
  const n={};D.items.forEach(i=>i.tags.forEach(t=>n[t]=(n[t]||0)+1));
  const top=Object.keys(n).sort((a,b)=>n[b]-n[a]).slice(0,10);
  $("tabs").innerHTML=top.length?["",...top].map(t=>`<button class="${t===tag?"on":""}" data-t="${esc(t)}">${t?esc(t):"Все"}</button>`).join(""):"";
}
function draw(){
  const q=$("q").value.toLowerCase().trim();
  const a=D.items.filter(i=>(!tag||i.tags.includes(tag))&&(i.title+" "+i.tags.join(" ")).toLowerCase().includes(q));
  $("count").textContent=D.items.length?`${a.length} из ${D.items.length}`:"Пока пусто";
  $("grid").innerHTML=a.length?a.map(i=>`<article><div class="ph">
  <img src="/api/photo/${i.id}" alt="${esc(i.title)}" loading="lazy" onload="this.classList.add('ok')" onerror="this.remove()">
  ${i.vip?'<span class="flag">Приоритет</span>':""}</div>
  <div class="meta"><h3>${esc(i.title)}</h3><p>Размер ${esc(i.size)}</p><div class="pr">${esc(i.price)}</div><button class="buy" data-l="${esc(i.link)}">Купить</button></div></article>`).join("")
  :`<div class="state"><b>${D.items.length?"Ничего не нашли":"Здесь пока пусто"}</b>${D.items.length?"Попробуй другое слово или тег.":"Выставь первую вещь, она появится после проверки."}</div>`;
}
$("q").oninput=draw;
$("tabs").onclick=e=>{const b=e.target.closest("button");if(b){tag=b.dataset.t;tabs();draw()}};
$("grid").onclick=e=>{const b=e.target.closest(".buy");if(b){try{tg.HapticFeedback.impactOccurred("light")}catch(x){}go(b.dataset.l)}};
$("post").onclick=$("go").onclick=()=>go(`https://t.me/${D.bot}?start=post`);
const sheet=v=>$("sheet").classList.toggle("on",v);
$("svc").onclick=()=>sheet(true);
$("sheet").onclick=e=>{if(e.target.id==="sheet")sheet(false)};
addEventListener("keydown",e=>{if(e.key==="Escape")sheet(false)});
function ready(d){
  D=d;tabs();draw();
  $("list").innerHTML=d.services.map(s=>`<div class="svc"><div>${esc(s.name)}<small>${esc(s.desc)}</small></div><b>${s.price} ₽</b></div>`).join("")
   +'<div class="svc"><div>Обычное<small>Публикация после проверки</small></div><b>Бесплатно</b></div>';
}
function load(){
  $("grid").innerHTML=sk();
  if(/[?&]demo/.test(location.search))return ready(DEMO);
  fetch("/api/items").then(r=>{if(!r.ok)throw 0;return r.json()}).then(ready).catch(()=>{
    $("count").textContent="Нет связи";
    $("grid").innerHTML='<div class="state"><b>Не удалось загрузить каталог</b>Проверь интернет и попробуй ещё раз.<br><button class="buy" id="retry">Обновить</button></div>';
    $("retry").onclick=load;
  });
}
const ST={available:"в каталоге",pending:"на проверке",pending_pay:"ждёт чек об оплате",rejected:"отклонено",sold:"продано"};
let ME=null;
const HD=()=>({"X-Init-Data":tg.initData||""});
function loadMe(){return fetch("/api/me",{headers:HD()}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(m=>{ME=m;drawMe()}).catch(()=>{ME=false;drawMe()})}
function drawMe(){
  const box=$("me");
  if(ME===null)return box.innerHTML='<div class="state">Загружаем</div>';
  if(!ME)return box.innerHTML='<div class="state"><b>Войдите через Telegram</b>Откройте каталог из бота, и кабинет создастся автоматически.</div>';
  const u=ME.user,since=new Date(u.since*1000).toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"});
  const items=ME.items.map(i=>`<div class="row"><div>${esc(i.title)}<small>${esc(i.price)}, ${ST[i.status]||i.status}${i.plan!=="free"?", приоритет":""}</small></div>`
   +(i.status==="available"?`<button class="buy" data-sold="${i.id}">Продано</button>`:i.status==="pending_pay"?'<button class="buy" data-bot="1">Открыть бота</button>':"")+"</div>").join("");
  const reqs=ME.requests.map(r=>`<div class="row"><div>${esc(r.title)}<small>${ST[r.status]||r.status}</small></div></div>`).join("");
  box.innerHTML=`<p style="color:var(--mut)">${u.username?"@"+esc(u.username)+"<br>":""}В каталоге с ${since}</p>
  <div class="nums"><div><b>${ME.items.length}</b><span>объявлений</span></div><div><b>${ME.incoming}</b><span>заявок на мои</span></div><div><b>${ME.requests.length}</b><span>моих заявок</span></div></div>
  <h4>Мои объявления</h4>${items||'<div class="state" style="padding:26px 0">Объявлений пока нет.</div>'}
  ${reqs?"<h4>Мои заявки</h4>"+reqs:""}`;
}
$("me").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.bot)return go(`https://t.me/${D.bot}`);
  const id=b.dataset.sold,run=()=>fetch("/api/sold/"+id,{method:"POST",headers:HD()}).then(()=>{loadMe();load()});
  tg.showConfirm?tg.showConfirm("Пометить как проданное?",ok=>ok&&run()):confirm("Пометить как проданное?")&&run();
};
document.querySelector(".seg").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  document.querySelectorAll(".seg button").forEach(x=>x.classList.toggle("on",x===b));
  const me=b.dataset.v==="me";$("cat").hidden=me;$("me").hidden=!me;
  $("h").textContent=me?"Кабинет":"Каталог";
  if(me){$("count").textContent=ME&&ME.user?ME.user.name:"";drawMe()}else draw();
};
load();loadMe();
</script></body></html>
